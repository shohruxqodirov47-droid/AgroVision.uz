<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgroSmart AI v4.0 — Universal Enterprise Agricultural Intelligence Platform</title>
  <meta name="description" content="Sun'iy intellekt yordamida ekin va mevalar kasalliklarini 100% aniqlash, NPK o'g'it me'yori va ulgurji bozor narxlari prognozi platformasi.">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="antialiased selection:bg-slate-700 selection:text-white">

  <div class="app-container">
    <!-- Sidebar Navigation -->
    <aside id="app-sidebar" class="sidebar">
      <!-- Brand Logo Header -->
      <div class="h-[70px] px-6 flex items-center gap-3 border-b border-color">
        <div class="w-10 h-10 rounded-xl bg-slate-800 flex items-center justify-center text-white shadow-md">
          <i data-lucide="sprout" class="w-6 h-6"></i>
        </div>
        <div>
          <span class="text-lg font-extrabold text-primary tracking-wide block leading-none">AgroSmart <span class="text-secondary">AI</span></span>
          <span class="text-[10px] text-muted font-semibold tracking-wider uppercase">Enterprise v4.0</span>
        </div>
      </div>

      <!-- Navigation Links -->
      <nav class="p-4 space-y-1.5 flex-1 overflow-y-auto">
        <button onclick="appRouter.navigate('landing')" data-nav="landing" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold border border-transparent transition-all">
          <i data-lucide="home" class="w-5 h-5"></i>
          <span data-i18n="navLanding">Bosh Sahifa</span>
        </button>

        <button onclick="appRouter.navigate('dashboard')" data-nav="dashboard" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold border border-transparent transition-all">
          <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
          <span data-i18n="navDashboard">Boshqaruv Paneli</span>
        </button>

        <button onclick="appRouter.navigate('diagnosis')" data-nav="diagnosis" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold border border-transparent transition-all">
          <i data-lucide="scan-line" class="w-5 h-5"></i>
          <span data-i18n="navDiagnosis">AI Diagnostika</span>
        </button>

        <button onclick="appRouter.navigate('fields')" data-nav="fields" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold border border-transparent transition-all">
          <i data-lucide="map-pin" class="w-5 h-5"></i>
          <span data-i18n="navFields">Maydonlar & Issiqxona</span>
        </button>

        <button onclick="appRouter.navigate('prices')" data-nav="prices" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold border border-transparent transition-all">
          <i data-lucide="trending-up" class="w-5 h-5"></i>
          <span data-i18n="navPrices">Bozor Narxlari</span>
        </button>

        <button onclick="appRouter.navigate('copilot')" data-nav="copilot" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold border border-transparent transition-all">
          <i data-lucide="bot" class="w-5 h-5"></i>
          <span data-i18n="navCopilot">AI Agronom</span>
        </button>

        <button onclick="appRouter.navigate('settings')" data-nav="settings" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold border border-transparent transition-all">
          <i data-lucide="settings" class="w-5 h-5"></i>
          <span data-i18n="navSettings">Sozlamalar</span>
        </button>
      </nav>

      <!-- Sidebar Footer User Card -->
      <div class="p-4 border-t border-color">
        <div class="p-3 rounded-xl bg-tertiary border border-color flex items-center gap-3">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=200" alt="Avatar" class="w-9 h-9 rounded-full object-cover border border-slate-600">
          <div class="overflow-hidden">
            <div class="text-xs font-bold text-primary truncate">Alisher Qodirov</div>
            <div class="text-[10px] text-muted truncate" data-i18n="roleLabel">Bosh Agronom / Fermer</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="main-content">
      <!-- Top Navbar -->
      <header class="top-navbar glass-header">
        <div class="flex items-center gap-3">
          <button onclick="toggleMobileSidebar()" class="lg:hidden btn-icon">
            <i data-lucide="menu" class="w-5 h-5"></i>
          </button>
          
          <div class="hidden sm:flex items-center gap-2 text-xs font-semibold text-secondary">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
            <span>Toshkent viloyati (26.5°C, Havo Namligi: 62%)</span>
          </div>
        </div>

        <!-- Controls: Language & Quick Diagnosis -->
        <div class="flex items-center gap-3">
          <select onchange="window.i18n.setLang(this.value)" class="bg-tertiary border border-color text-primary text-xs font-bold rounded-lg px-3 py-2 focus:outline-none">
            <option value="uz">🇺🇿 O'zbekcha</option>
            <option value="en">🇬🇧 English</option>
            <option value="ru">🇷🇺 Русский</option>
          </select>

          <button onclick="appRouter.navigate('diagnosis')" class="btn-primary text-xs py-2 px-3">
            <i data-lucide="scan-line" class="w-3.5 h-3.5"></i>
            <span data-i18n="btnNewDiagnosis">AI Diagnostika</span>
          </button>
        </div>
      </header>

      <!-- View Containers -->
      <main class="flex-1">
        <div id="view-landing" class="view-container"></div>
        <div id="view-dashboard" class="view-container hidden"></div>
        <div id="view-diagnosis" class="view-container hidden"></div>
        <div id="view-fields" class="view-container hidden"></div>
        <div id="view-prices" class="view-container hidden"></div>
        <div id="view-copilot" class="view-container hidden"></div>
        <div id="view-settings" class="view-container hidden"></div>
      </main>
    </div>
  </div>

  <script>
    function toggleMobileSidebar() {
      const sidebar = document.getElementById('app-sidebar');
      if (sidebar) sidebar.classList.toggle('mobile-open');
    }
  </script>

  <!-- JS Module Scripts -->
  <script src="js/store.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/components/landing.js"></script>
  <script src="js/components/dashboard.js"></script>
  <script src="js/components/diagnosis.js"></script>
  <script src="js/components/fields.js"></script>
  <script src="js/components/prices.js"></script>
  <script src="js/components/copilot.js"></script>
  <script src="js/components/settings.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
