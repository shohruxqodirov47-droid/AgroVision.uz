<!DOCTYPE html>
<html lang="uz" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tizimga Kirish - AgroVision AI</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              900: '#064e3b',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-stone-50 text-slate-800 font-sans antialiased min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <!-- Logo -->
    <div class="text-center mb-8">
      <a href="{{ url_for('login') }}" class="inline-flex items-center gap-3 group">
        <img src="{{ url_for('static', filename='img/logo.jpg') }}" alt="AgroVision AI Logo" class="w-12 h-12 object-contain group-hover:scale-105 transition-transform" />
        <div class="text-left">
          <span class="text-2xl font-extrabold tracking-tight text-slate-900 flex items-center gap-1.5">
            AgroVision <span class="text-brand-600">AI</span>
          </span>
        </div>
      </a>
    </div>

    <!-- Login Card -->
    <div class="bg-white p-8 rounded-3xl border border-stone-200 shadow-xl shadow-stone-200/50 relative">
      <h2 class="text-2xl font-extrabold text-slate-900 text-center mb-6">Xush Kelibsiz! 👋</h2>
      
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="mb-4 p-3 rounded-xl text-sm font-bold text-center {% if category == 'error' %}bg-rose-50 text-rose-600 border border-rose-200{% else %}bg-brand-50 text-brand-600 border border-brand-200{% endif %}">
              {{ message }}
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form action="{{ url_for('login') }}" method="POST" class="space-y-5">
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1.5">Elektron pochta</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
              <i class="fa-solid fa-envelope"></i>
            </div>
            <input type="email" name="email" required placeholder="fermer@mail.uz" class="w-full pl-10 pr-4 py-3 bg-stone-50 border border-stone-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-all text-slate-700 font-medium outline-none">
          </div>
        </div>

        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1.5">Parol</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
              <i class="fa-solid fa-lock"></i>
            </div>
            <input type="password" name="password" required placeholder="••••••••" class="w-full pl-10 pr-4 py-3 bg-stone-50 border border-stone-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-all text-slate-700 font-medium outline-none">
          </div>
        </div>

        <button type="submit" class="w-full py-3.5 rounded-xl bg-brand-500 hover:bg-brand-600 text-white font-bold text-base shadow-lg shadow-brand-500/25 transition-all mt-4">
          Tizimga Kirish <i class="fa-solid fa-arrow-right ml-1"></i>
        </button>

        <div class="relative flex items-center py-4">
          <div class="flex-grow border-t border-stone-200"></div>
          <span class="flex-shrink-0 mx-4 text-slate-400 text-xs font-bold uppercase">yoki</span>
          <div class="flex-grow border-t border-stone-200"></div>
        </div>

        <a href="{{ url_for('login_google') }}" class="w-full py-3.5 flex items-center justify-center gap-2 rounded-xl bg-white border border-stone-200 hover:bg-stone-50 text-slate-700 font-bold text-base shadow-sm transition-all">
          <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png" alt="Google" class="w-5 h-5">
          Google orqali davom etish
        </a>
      </form>

      <div class="mt-6 text-center text-sm font-medium text-slate-500">
        Profil yo'qmi? 
        <a href="{{ url_for('register') }}" class="text-brand-600 font-bold hover:underline">Ro'yxatdan o'tish</a>
      </div>
    </div>
  </div>
</body>
</html>
