<!DOCTYPE html>
<html lang="uz" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agro-Radar - Kasalliklar Xaritasi</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              900: '#064e3b',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
</head>
<body class="bg-stone-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col selection:bg-brand-500 selection:text-white">

  <!-- NAVBAR -->
  <header class="fixed top-0 left-0 right-0 z-50 bg-white/80 backdrop-blur-xl border-b border-stone-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <a href="{{ url_for('index') }}" class="flex items-center gap-3 group">
        <img src="{{ url_for('static', filename='img/logo.jpg') }}" alt="AgroVision AI Logo" class="w-12 h-12 object-contain group-hover:scale-105 transition-transform" />
        <div>
          <span class="text-xl font-extrabold tracking-tight text-slate-900 flex items-center gap-1.5">
            AgroVision <span class="text-brand-600">AI</span>
          </span>
          <span class="text-[10px] tracking-widest uppercase font-semibold text-slate-500 hidden sm:block -mt-1">Agro-Intelligence Platform</span>
        </div>
      </a>

      <div class="flex items-center gap-2 sm:gap-4 flex-shrink-0 pl-4">
        <span class="text-sm font-bold text-slate-700 hidden sm:block">Xush kelibsiz, <span class="text-brand-600">{{ user.name }}</span></span>
        <a href="{{ url_for('index') }}" class="px-3 sm:px-4 py-2 rounded-xl bg-stone-100 hover:bg-stone-200 text-slate-700 font-bold text-sm transition-all flex items-center gap-2">
          <i class="fa-solid fa-house"></i>
          <span class="hidden sm:inline">Bosh sahifa</span>
        </a>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="flex-1 pt-28 pb-20 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full flex flex-col min-h-screen h-[100vh]">
    
    <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-6 gap-4 shrink-0">
      <div>
        <h1 class="text-3xl font-extrabold text-slate-900 flex items-center gap-3">
          <i class="fa-solid fa-map-location-dot text-rose-500"></i> Agro-Radar
        </h1>
        <p class="text-slate-500 mt-2 font-medium">O'zbekiston hududida tarqalayotgan kasalliklar xaritasi (So'nggi 100 ta tahlil)</p>
      </div>
      
      <div class="flex gap-2">
        <span class="flex items-center gap-2 text-xs font-bold px-3 py-1.5 bg-rose-50 text-rose-600 rounded-lg border border-rose-100">
          <div class="w-2 h-2 rounded-full bg-rose-500 animate-pulse"></div>
          Yuqori xavf
        </span>
        <span class="flex items-center gap-2 text-xs font-bold px-3 py-1.5 bg-amber-50 text-amber-600 rounded-lg border border-amber-100">
          <div class="w-2 h-2 rounded-full bg-amber-500"></div>
          O'rta xavf
        </span>
      </div>
    </div>

    <!-- Map Container -->
    <div class="bg-white rounded-3xl border border-stone-200 shadow-xl overflow-hidden flex-1 relative min-h-[500px]">
      <div id="map" class="absolute inset-0 w-full h-full z-0"></div>
    </div>

  </main>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  
  <script>
    var map = L.map('map').setView([41.3775, 64.5853], 6);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '© OpenStreetMap contributors',
      className: 'map-tiles'
    }).addTo(map);

    document.querySelector('.map-tiles').style.filter = 'contrast(1.1) brightness(1.1)';

    var mapData = {{ map_data | tojson | safe }};
    
    mapData.forEach(function(item) {
      // Bir xil nuqtalar ustma-ust tushmasligi uchun jitter
      var latJitter = (Math.random() - 0.5) * 0.4;
      var lngJitter = (Math.random() - 0.5) * 0.4;
      var finalLat = item.lat + latJitter;
      var finalLng = item.lng + lngJitter;

      var color = '#10b981'; 
      var pulseClass = '';
      if (item.risk_level.includes('YUQORI')) {
        color = '#f43f5e'; 
        pulseClass = 'animate-pulse shadow-[0_0_15px_rgba(244,63,94,0.6)]';
      } else if (item.risk_level.includes("O'RTA")) {
        color = '#f59e0b'; 
      }

      var customIcon = L.divIcon({
        className: 'custom-div-icon',
        html: `<div class="w-4 h-4 rounded-full border-2 border-white ${pulseClass}" style="background-color: ${color};"></div>`,
        iconSize: [16, 16],
        iconAnchor: [8, 8]
      });

      var marker = L.marker([finalLat, finalLng], {icon: customIcon}).addTo(map);
      
      var popupContent = `
        <div class="p-1 min-w-[200px]">
          <h4 class="font-bold text-slate-900 border-b pb-1 mb-2 text-sm">${item.region}</h4>
          <p class="text-xs mb-1 font-semibold"><span class="text-slate-500">Ekin:</span> ${item.crop}</p>
          <p class="text-xs mb-1 font-semibold text-rose-600"><span class="text-slate-500">Kasallik:</span> ${item.diagnosis}</p>
          <p class="text-[10px] text-slate-400 mt-2 text-right">${item.date}</p>
        </div>
      `;
      marker.bindPopup(popupContent, {
        className: 'custom-popup'
      });
    });
  </script>
  
  <style>
    .leaflet-popup-content-wrapper {
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }
    .leaflet-popup-content {
      margin: 12px;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .custom-div-icon {
      background: transparent;
      border: none;
    }
  </style>

</body>
</html>
